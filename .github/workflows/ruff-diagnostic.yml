name: Ruff Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install exact Ruff gate version
        run: |
          pip install --upgrade pip
          pip install "ruff==0.16.2"

      - name: Capture full-tree Ruff reports
        shell: bash
        run: |
          set +e
          ruff --version > ruff-version.txt
          ruff check . --output-format=concise > ruff-report.txt 2>&1
          check_status=$?
          ruff format --check . > ruff-format-report.txt 2>&1
          format_status=$?
          printf 'check_exit_code=%s\nformat_exit_code=%s\n' "$check_status" "$format_status" > ruff-status.txt
          printf 'Ruff check exit code: %s\nRuff format exit code: %s\n' "$check_status" "$format_status" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostic-${{ github.sha }}
          path: |
            ruff-report.txt
            ruff-format-report.txt
            ruff-status.txt
            ruff-version.txt
          retention-days: 1
          if-no-files-found: error
