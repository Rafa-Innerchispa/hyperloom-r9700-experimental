name: Lint

# Static analysis on push and pull_request for all branches. Skips when every
# changed file matches paths-ignore (same list as ``tests-coverage.yml``).
#
# Ruff is ratcheted: changed Python files are hard gates, while the historical
# full-tree backlog remains visible as advisory output until it is driven to
# zero. This prevents new lint debt without making every unrelated PR inherit
# the legacy backlog.
#
# Pylint: ``--errors-only`` limits output to fatal/error-severity messages
# (not convention or refactor hints). tree-reform.MD P2.5: critic-agent,
# robustness-agent, framework-agent, and quantization_agent were all promoted
# into the single ``hyperloom`` distribution (``hyperloom.agents.*``); the
# single editable install below covers all of them (no more per-agent
# editable installs / separate PYTHONPATH entries / bare ``runtime`` module).
#
# Bandit scans production Python code only (tests excluded) for medium+ security
# findings. It remains advisory while the security baseline is being ratcheted.
on:
  # PRs run via ``pull_request``; ``push`` is scoped to ``main`` so a same-repo
  # PR does not double-trigger (one run per event class).
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "COPYRIGHT"
      - "CODEOWNERS"
      - ".gitattributes"

permissions:
  contents: read

# Cancel superseded runs for the same ref.
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The ratchet compares the current event against its real base SHA.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Ruff
        # Pinned exactly, not a floating range. A Ruff release must not change
        # the gate without a deliberate repository change.
        run: |
          pip install --upgrade pip
          pip install "ruff==0.16.2"

      - name: Determine changed Python files
        id: changed_py
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BEFORE_SHA"
          fi

          # GitHub uses an all-zero before SHA for the first push of a branch.
          # Fall back to the root commit rather than silently skipping lint.
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          mapfile -t files < <(
            git diff --diff-filter=ACMR --name-only "$base" "$GITHUB_SHA" -- '*.py'
          )

          if (( ${#files[@]} == 0 )); then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
            echo "No changed Python files."
            exit 0
          fi

          printf '%s\0' "${files[@]}" > /tmp/ruff-changed-python-files
          echo "has_files=true" >> "$GITHUB_OUTPUT"
          printf 'Changed Python files:\n%s\n' "${files[@]}"

      - name: Ruff check changed Python files (hard gate)
        if: steps.changed_py.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t files < /tmp/ruff-changed-python-files
          ruff check --force-exclude "${files[@]}"

      - name: Ruff format changed Python files (hard gate)
        if: steps.changed_py.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' -t files < /tmp/ruff-changed-python-files
          ruff format --check --force-exclude "${files[@]}"

      - name: Ruff full-tree backlog scan (advisory)
        id: ruff_full_tree
        continue-on-error: true
        run: ruff check .

      - name: Ruff full-tree format backlog scan (advisory)
        id: ruff_format_full_tree
        continue-on-error: true
        run: ruff format --check .

      - name: Advisory notice for historical Ruff backlog
        if: >-
          always() &&
          (steps.ruff_full_tree.outcome == 'failure' ||
           steps.ruff_format_full_tree.outcome == 'failure')
        run: |
          echo "::warning::Full-tree Ruff backlog remains advisory. Changed Python files are still hard-gated, so new lint debt cannot enter through this workflow."

  compile:
    name: byte-compile (syntax check)
    runs-on: ubuntu-latest
    # Seconds long, and it catches the failure mode ruff cannot: ruff parses
    # with its own frontend, so a construct CPython rejects can lint clean.
    # The vendored `kernelforge` tree arrived via a bulk rename, which is
    # exactly how syntax casualties get introduced. Ported from KernelForge's
    # pre-merge.yml, which compiled the two source packages it had back then;
    # those are one package now, so this compiles it plus hyperloom itself.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Byte-compile package sources
        run: python -m compileall -q src/kernelforge src/hyperloom

  bandit:
    name: bandit (medium+, production code)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          pip install --upgrade pip
          pip install "bandit>=1.7,<2"

      - name: Bandit scan
        id: bandit_scan
        continue-on-error: true
        run: |
          # scripts/ is included deliberately: platform_audit_bmc.py mints BMC
          # credentials and runs privileged subprocesses, so it is exactly the
          # code a security scanner should see, even though it ships outside the
          # package. This widens the full-tree invocation only -- pre-commit's
          # Bandit hook is passed explicit filenames and already covered
          # scripts/ -- and the step stays advisory (continue-on-error), so it
          # reports rather than gates.
          #
          # src/kernelforge is scanned for the same reason as scripts/: it shells
          # out to rocprofv3, ninja and git and launches agent CLIs. It reports
          # ~27 medium-or-higher findings today, all pre-existing in the vendored
          # tree and untriaged; the step is advisory, so they are visible without
          # blocking. Triaging them is tracked separately.
          #
          # -c pyproject.toml is required, not cosmetic: [tool.bandit]
          # exclude_dirs (which keeps the shipped sample kernels under
          # kernelforge/data out of the scan) is inert unless the config is
          # passed. B101 in the same table is already below --severity-level
          # medium, so the config changes nothing for the existing scan.
          bandit -c pyproject.toml -r src/hyperloom src/kernelforge scripts \
            -x "*/tests/*" -q --severity-level medium

      - name: Advisory notice when Bandit failed
        if: always() && steps.bandit_scan.outcome == 'failure'
        run: |
          echo "::warning::Bandit reported medium-or-higher security findings (advisory: step uses continue-on-error). Review findings before making this a hard gate."

  pylint:
    name: pylint (errors-only, multi-package)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Pylint and editable packages
        run: |
          pip install --upgrade pip
          pip install "pylint>=3.0,<4"
          pip install -e ".[test]"

      - name: Pylint (errors only)
        continue-on-error: true
        env:
          # ``quantization_agent`` and ``ci`` are still flat repo-root
          # packages (tree-reform.MD P2.6 promotes ``ci``; quantization_agent
          # itself was promoted into hyperloom.agents but the bare-name
          # dotted-path below is kept for the pylint invocation).
          PYTHONPATH: >-
            ${{ github.workspace }}
        run: |
          # src/kernelforge is deliberately NOT in this list, and the omission
          # is measured rather than inherited: adding it yields ~58 findings,
          # essentially all E1120 no-value-for-parameter on click-decorated
          # commands, whose parameters are injected by the decorators pylint
          # does not follow. Two findings land in non-click production code and
          # both are the known __dataclass_fields__ false positive. At that
          # signal-to-noise ratio the errors-only job stops being readable for
          # the packages it does cover. Bandit above *does* scan kernelforge --
          # a security scanner has different economics than a type checker.
          pylint --errors-only \
            hyperloom.inference_optimizer \
            hyperloom.orchestrator \
            hyperloom.agents.robustness \
            hyperloom.agents.framework \
            hyperloom.agents.critic.runtime \
            hyperloom.agents.quantization

  mypy:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install mypy and editable package
        run: |
          pip install --upgrade pip
          pip install "mypy>=1.0"
          pip install -e ".[test]"

      - name: Mypy
        id: mypy
        continue-on-error: true
        run: mypy src/hyperloom

      - name: Advisory notice when Mypy failed
        if: always() && steps.mypy.outcome == 'failure'
        run: |
          echo "::warning::Mypy reported type errors (advisory: step uses continue-on-error). Fix new errors in touched modules; flip to hard-fail after backlog shrinks."
